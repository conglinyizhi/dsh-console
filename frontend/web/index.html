<!-- favicon 走内联 SVG data URI（与 Vue 版同一枚）：不引外部文件，也就没有 /favicon.ico 的 404。 -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%234f8cff'/%3E%3Cpath d='M12 6.5a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11Zm0 3a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5Z' fill='%23fff'/%3E%3C/svg%3E">
<!-- 全部样式就这一份：reset + 设计 token + 版式，由 cmd/build-styles 用 precss 从 styles/app.scss 编出。
     图标不是字体，是 icons.mbt 里的内联 SVG，所以这里没有任何字体/图标资源要挂。 -->
<link rel="stylesheet" href="/assets/app.css?v=__BUILD__">
</head>

<div id="dsh-console-root"></div>
