<!doctype html>
<html lang="zh-CN" class="v-theme--dark dsh-skin">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DSH 控制台</title>
<!-- favicon 走内联 SVG data URI（与 Vue 版同一枚）：不引外部文件，也就没有 /favicon.ico 的 404。 -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%234f8cff'/%3E%3Cpath d='M12 6.5a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11Zm0 3a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5Z' fill='%23fff'/%3E%3C/svg%3E">
<!-- MDI 字体：md2 的图标通道（<i class="mdi-xxx mdi v-icon">）靠它出字形。 -->
<link rel="stylesheet" href="/assets/mdi/css/materialdesignicons.min.css">
<!-- md2 三层（vendor → theme → md2）+ 本页布局层，由 cmd/build-styles 用 precss 编出。 -->
<link rel="stylesheet" href="/assets/app.css">
<!-- dsh 皮肤：把 md2 的主题变量覆写成 dsh-console 的设计 token。
     对比用的另一份外壳（md2-raw.html）不挂这个文件，其余完全一致。 -->
<link rel="stylesheet" href="/assets/dsh-skin.css">
</head>
<body>
<div id="dsh-console-root"></div>
<script src="/assets/app.js" defer></script>
</body>
</html>
