name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# 同一分支上的旧任务直接取消，新的跑完为准。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      # MoonBit 工具链用官方安装脚本，不用第三方 action。
      # 装完把 ~/.moon/bin 追加到 PATH（后续步骤才看得见 moon）。
      - name: Install MoonBit (Unix)
        if: runner.os != 'Windows'
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Install MoonBit (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "$env:USERPROFILE\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: moon version
        run: moon version

      # 新装工具链自带的 registry 索引可能落后，直接 check 会报
      # module was not found in the registry。
      - name: moon update
        run: moon update

      # backend/rawsink/rawsink_wbtest.mbt 往 .tmp-verify/rawsink-test 里写一行再读回来，
      # 但自己不建目录（本地有这个目录，是跑测试时留下的）。干净检出里没有它，
      # 写会被内部 catch 吞掉、读会失败，所以测试之前先建出来。
      - name: Prepare test scratch dir
        shell: bash
        run: mkdir -p backend/.tmp-verify/rawsink-test

      # 构建和测试都走 scripts/cli.mbtx —— 和本地开发、发布用的是同一条链。
      # 加 --release：CI 出的产物是要发出去的，版本标识用 git sha，moon 也开优化。
      # ubuntu 跑全量（含前端构建链）；macOS 只构建后端 —— 前端那条链在 macOS 上
      # 还没跑通过（bash 版本、sed/sha 工具差异），先不让它挡住 CI。
      - name: Build (release, ubuntu)
        if: runner.os == 'Linux'
        run: moon run scripts/cli.mbtx -- build --release

      - name: Build (release, macOS, 全量：临时为了拿前端失败的现场)
        if: runner.os == 'macOS'
        run: moon run scripts/cli.mbtx -- build --release

      - name: Test (unix)
        if: runner.os != 'Windows'
        run: moon run scripts/cli.mbtx -- test

      # Windows runner 装不了 native 目标要的链接环境（cl.exe / link.exe 默认不在 PATH），
      # 只验类型检查：后端 --deny-warn、前端普通 check。
      - name: Check (Windows)
        if: runner.os == 'Windows'
        run: moon run scripts/cli.mbtx -- check

      - name: Smoke (e2e)
        if: runner.os == 'Linux'
        run: moon run scripts/cli.mbtx -- smoke
